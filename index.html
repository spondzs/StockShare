<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>SpondFlow Stock Share</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --blue1: #2F6FED;
      --blue2: #6EA0FF;
      --bg: #F3F7FF;
      --text: #1F2937;
      --muted: #7A8292;
      --barBg: #DCE8FF;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    .screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 42px 24px calc(20px + env(safe-area-inset-bottom));
    }

    .loader {
      width: min(300px, 100%);
      text-align: center;
      margin-top: 4px;
    }

    .mascot-wrap {
      position: relative;
      width: 138px;
      height: 138px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floaty 1.8s ease-in-out infinite;
    }

    .mascot-glow {
      position: absolute;
      inset: 10px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(47,111,237,.20), rgba(47,111,237,0) 68%);
      filter: blur(8px);
    }

    .mascot {
      position: relative;
      z-index: 1;
      width: 104px;
      height: 104px;
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(47, 111, 237, .18));
    }

    .status {
      min-height: 24px;
      margin: 0 auto 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 500;
    }

    .bar {
      width: 100%;
      height: 9px;
      border-radius: 999px;
      background: var(--barBg);
      overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,.04);
    }

    .bar-fill {
      width: 8%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--blue1), var(--blue2));
      transition: width .28s ease;
    }

    .percent {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 800;
      color: #5F6B85;
    }

    .actions {
      display: none;
      gap: 10px;
      margin-top: 22px;
    }

    .actions.show {
      display: flex;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 15px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
    }

    .btn-primary {
      color: #fff;
      background: linear-gradient(180deg, var(--blue2), var(--blue1));
      box-shadow: 0 10px 22px rgba(47,111,237,.20);
    }

    .btn-secondary {
      color: #566070;
      background: rgba(255,255,255,.76);
      border: 1px solid rgba(210,220,240,.9);
    }

    .debug {
      display: none;
      margin-top: 16px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.72);
      border: 1px dashed rgba(122,130,146,.25);
      color: #64748B;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      text-align: left;
      max-height: 150px;
      overflow: auto;
    }

    .debug.show {
      display: block;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @media (max-height: 560px) {
      .screen {
        padding-top: 26px;
      }

      .mascot-wrap {
        width: 112px;
        height: 112px;
        margin-bottom: 14px;
      }

      .mascot {
        width: 86px;
        height: 86px;
      }

      .status {
        margin-bottom: 14px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <section class="loader">
      <div class="mascot-wrap">
        <div class="mascot-glow"></div>
        <img class="mascot" src="./Caffe.PNG?v=6" alt="NongCaffe">
      </div>

      <div id="desc" class="status">กำลังเตรียมสต็อก...</div>

      <div class="bar">
        <div id="barFill" class="bar-fill"></div>
      </div>

      <div id="percent" class="percent">8%</div>

      <div id="actions" class="actions">
        <button class="btn-primary" onclick="startShare()">ลองอีกครั้ง</button>
        <button class="btn-secondary" onclick="closeLiff()">ปิด</button>
      </div>

      <div id="debug" class="debug"></div>
    </section>
  </main>

  <script>
    const LIFF_ID = "2009366271-TiSiW5ES";
    const API_BASE = "https://script.google.com/macros/s/AKfycbw4jAzjWors_9dwQx1bI2RpVzm56icKOcTDYutQZIindgZb3f67MqoduccqgFnM6TzgaA/exec";

    let CURRENT_BRAND = "vivo";
    let DEBUG_MODE = false;

    function qs(name, fallback) {
      const u = new URL(window.location.href);
      return u.searchParams.get(name) || fallback || "";
    }

    function setProgress(n, text) {
      const p = Math.max(0, Math.min(100, Number(n || 0)));
      document.getElementById("barFill").style.width = p + "%";
      document.getElementById("percent").textContent = Math.round(p) + "%";
      if (text) document.getElementById("desc").textContent = text;
    }

    function showActions() {
      document.getElementById("actions").classList.add("show");
    }

    function hideActions() {
      document.getElementById("actions").classList.remove("show");
    }

    function logDebug(msg) {
      if (!DEBUG_MODE) return;
      const el = document.getElementById("debug");
      el.classList.add("show");
      el.textContent += "\n" + String(msg || "");
    }

    function closeLiff() {
      if (window.liff && liff.isInClient()) {
        liff.closeWindow();
      }
    }

    function loadJsonp(url) {
      return new Promise(function(resolve, reject) {
        const cb = "__stock_cb_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
        const script = document.createElement("script");

        window[cb] = function(data) {
          cleanup();
          resolve(data);
        };

        function cleanup() {
          try { delete window[cb]; } catch (_) { window[cb] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        script.onerror = function() {
          cleanup();
          reject(new Error("JSONP load failed"));
        };

        script.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "callback=" + encodeURIComponent(cb);
        document.body.appendChild(script);

        setTimeout(function() {
          if (window[cb]) {
            cleanup();
            reject(new Error("JSONP timeout"));
          }
        }, 12000);
      });
    }

    async function startShare() {
      hideActions();

      try {
        setProgress(12, "กำลังเปิดระบบแชร์...");
        logDebug("LIFF_ID = " + LIFF_ID);

        if (!window.liff) throw new Error("LIFF SDK not found");

        await liff.init({
          liffId: LIFF_ID,
          withLoginOnExternalBrowser: true
        });

        setProgress(30, "กำลังเชื่อมต่อ LINE...");

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        if (!liff.isInClient()) {
          throw new Error("กรุณาเปิดผ่าน LINE");
        }

        setProgress(52, "กำลังโหลดสต็อก " + CURRENT_BRAND + "...");

        const apiUrl =
          API_BASE +
          "?action=stock_share_payload" +
          "&brand=" + encodeURIComponent(CURRENT_BRAND);

        logDebug("API: " + apiUrl);

        const data = await loadJsonp(apiUrl);

        logDebug("Payload: " + JSON.stringify(data).slice(0, 500));

        if (!data || data.ok === false) {
          throw new Error((data && (data.error || data.message)) || "โหลดข้อมูลไม่สำเร็จ");
        }

        if (!Array.isArray(data.messages) || !data.messages.length) {
          throw new Error("ไม่พบข้อความสำหรับแชร์");
        }

        if (!liff.isApiAvailable("shareTargetPicker")) {
          throw new Error("เครื่องนี้ยังไม่รองรับการแชร์");
        }

        setProgress(78, "กำลังเปิดรายชื่อ LINE...");

        const result = await liff.shareTargetPicker(data.messages);

        if (result) {
          setProgress(100, "แชร์เรียบร้อยครับ");
          setTimeout(closeLiff, 850);
        } else {
          setProgress(100, "ยกเลิกการแชร์แล้วครับ");
          showActions();
        }

      } catch (err) {
        console.error(err);
        logDebug("ERROR: " + (err && err.message ? err.message : err));

        setProgress(100, err && err.message ? err.message : "เกิดข้อผิดพลาด");
        showActions();
      }
    }

    window.addEventListener("load", function() {
      CURRENT_BRAND = String(qs("brand", "vivo")).toLowerCase();
      DEBUG_MODE = qs("debug", "") === "1";

      setProgress(8, "กำลังเตรียมสต็อก " + CURRENT_BRAND + "...");
      setTimeout(startShare, 350);
    });
  </script>
</body>
</html>
